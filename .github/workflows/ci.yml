name: CI
# Every pull request: lint, build, typecheck and test, in one job of a few minutes. The Storybook
# goes to Chromatic from storybook.yml, only when a part or a story changes.
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Changesets compares the branch with its base to find what it changes.
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Apps draw only with what the remote allowlist allows: it may add, never take away, against the
      # baseline committed beside it (scripts/check-allowlist.mjs).
      - name: Does the remote allowlist only add?
        run: pnpm check:allowlist
      - name: Every change says how it is released
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
        run: pnpm changeset status --since=origin/${{ github.base_ref }}
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      # Common's and Quill's public surface against their committed API reports, and the changeset a
      # removal needs (scripts/check-api.mjs). Needs the build above. Run by hand, it compares with main.
      # The Version packages pull request only spends changesets that were checked as they merged.
      - name: Do the API reports match?
        if: ${{ !startsWith(github.head_ref, 'changeset-release/') }}
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        run: pnpm check:api
