name: Release
# On main: Changesets keeps a "Version packages" pull request open while changes wait to be released.
# Merging it is the release. This workflow then:
#   1. publishes each package whose version isn't in GitHub Packages yet, as @<owner>/augur-<name>
#      (scripts/publish-packages.mjs), for AUGUR and apps to build against;
#   2. when the kit bundle's version is new, signs its kit.json with cosign keyless before it is
#      published (the package carries the signature), and makes the GitHub release kit@<version>: the
#      bundle as kit-<version>.tgz and its kit.json, each signed, so the signature names this workflow
#      on this repository's main. AUGUR's release checks it, then serves the bundle at its
#      KIT_URL (ADR 0048 in the AUGUR repository). Every kit release starts as a beta (a pre-release).
on:
  push:
    branches: [main]
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write # cosign keyless: the signature names this workflow
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Opening the pull request needs a token that may: RELEASE_TOKEN (a fine-grained token with Contents
      # and Pull requests write here), whose pull requests also start CI. Without it, the run's own token
      # is used, which may open it only when "Allow GitHub Actions to create and approve pull requests" is
      # on. If neither can, the branch is still pushed and the next step says where to open it by hand.
      - name: Version packages pull request
        id: changesets
        continue-on-error: true
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm version-packages
          title: Version packages
          commit: Version packages
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
      - name: Open the Version packages pull request by hand
        if: steps.changesets.outcome == 'failure'
        run: |
          if git ls-remote --exit-code origin changeset-release/main >/dev/null; then
            echo "::warning title=Version packages pull request not opened::This workflow may not open pull requests here. Open it from https://github.com/$GITHUB_REPOSITORY/compare/main...changeset-release/main (title: Version packages), or set RELEASE_TOKEN so it opens itself."
          else
            echo "::error::The Version packages step failed before it pushed its branch; see its log."
            exit 1
          fi
      # The Version packages step leaves the versioned branch checked out. What is released is only ever
      # main as pushed, so go back to it before looking: a release happens when the Version packages
      # pull request is merged, never from the branch that proposes it.
      - name: Back to main as pushed
        run: git checkout --force --detach "$GITHUB_SHA" && git clean -fdq
      # Only a changeset that bumps a package holds the release (an empty one doesn't).
      - name: Anything waiting to be versioned?
        id: pending
        run: echo "releases=$(node scripts/pending-bumps.mjs)" >> "$GITHUB_OUTPUT"
      - name: Build
        if: steps.pending.outputs.releases == '0'
        run: pnpm build
      - name: Is this kit released yet?
        id: kit
        if: steps.pending.outputs.releases == '0'
        run: |
          v=$(node -p "require('./packages/kit-bundle/package.json').version")
          if [ "$v" = "0.0.0" ] || gh release view "kit@$v" >/dev/null 2>&1; then
            echo "Kit $v needs no release"
          else
            echo "version=$v" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - if: steps.kit.outputs.version
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      # Signed before the packages are published, so @augur/kit-bundle carries its own signature
      # (dist/kit.json.sigstore.json): AUGUR checks it from the package, with no release download.
      - name: Sign the kit
        if: steps.kit.outputs.version
        run: cosign sign-blob --yes --bundle packages/kit-bundle/dist/kit.json.sigstore.json packages/kit-bundle/dist/kit.json
      - name: Publish packages
        id: publish
        if: steps.pending.outputs.releases == '0'
        run: node scripts/publish-packages.mjs
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - name: Release the kit
        if: steps.kit.outputs.version
        run: |
          v="${{ steps.kit.outputs.version }}"
          out="$RUNNER_TEMP/kit"
          mkdir -p "$out"
          tar -czf "$out/kit-$v.tgz" -C packages/kit-bundle/dist .
          cosign sign-blob --yes --bundle "$out/kit-$v.tgz.sigstore.json" "$out/kit-$v.tgz"
          node scripts/kit-notes.mjs "$v" > "$out/notes.md"
          gh release create "kit@$v" --prerelease --target "$GITHUB_SHA" --title "Kit $v" --notes-file "$out/notes.md" \
            "$out/kit-$v.tgz" "$out/kit-$v.tgz.sigstore.json" packages/kit-bundle/dist/kit.json packages/kit-bundle/dist/kit.json.sigstore.json
        env:
          GH_TOKEN: ${{ github.token }}
      # Last, so a package this repository may not publish yet doesn't hold back the others or the kit.
      - name: Every package published
        if: steps.publish.outputs.blocked
        run: |
          echo "::error::Not published: ${{ steps.publish.outputs.blocked }}. Give this repository Write under each package's Manage Actions access, then re-run this workflow."
          exit 1
